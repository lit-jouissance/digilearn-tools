<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6f9f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 반 학습도구">
<meta name="description" content="만다라트·마인드맵·워드클라우드·담벼락·투표·받아쓰기 등 우리 반 수업 활동 도구 모음">
<title>우리 반 학습도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--ink:#22303c;--sub:#5b6b78;--line:#3d4f5f;--soft:#eef4f8;--accent:#2f6f9f;--title:#fff6d6;--titleLine:#c99a12;--bg:#eef2f5;--warn:#d0457a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit;color:inherit}

/* 상단 막대 */
.top{position:sticky;top:0;z-index:20;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.top-in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 14px}
.brand{font-weight:900;font-size:18px;cursor:pointer;letter-spacing:-.3px;border:0;background:none;padding:0}
.brand span{color:var(--accent)}
.who-box{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.chip-s{background:var(--soft);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.btn{border:1px solid #c7d2db;background:#fff;border-radius:999px;padding:7px 14px;font-size:13.5px;cursor:pointer;white-space:nowrap;line-height:1.2}
.btn:hover{background:#f6f9fb}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.pri:hover{background:#285f88}
.btn:disabled{opacity:.55;cursor:default}
.btn.warn{border-color:var(--warn) !important;color:var(--warn) !important;background:#fff !important}
.btn.sm{padding:5px 11px;font-size:12.5px}

main{max-width:960px;margin:0 auto;padding:14px 14px 60px}

/* 홈 */
.hero{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:6px}
.hero h1{margin:0 0 4px;font-size:21px;font-weight:900}
.hero p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.55}
.gsec{margin-top:22px}
.ghead{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--gc)}
.ghead .gi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 auto}
.ghead h2{margin:0;font-size:20px;font-weight:900;letter-spacing:-.3px;line-height:1.2}
.ghead small{display:block;font-size:12.5px;color:var(--sub);margin-top:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.card{background:#fff;border:1px solid #e1e7ec;border-top:4px solid;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;align-items:center;transition:transform .12s,box-shadow .12s;min-width:0}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.card .ic{font-size:22px;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card .ct{min-width:0}
.card b{display:block;font-size:15px;line-height:1.3;word-break:keep-all}
.card small{display:block;color:var(--sub);font-size:12px;line-height:1.35;margin-top:2px;word-break:keep-all}

/* 도구 화면 */
.thead{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.thead h2{margin:0;font-size:22px;font-weight:900}
.thead p{margin:0;width:100%;color:var(--sub);font-size:13.5px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
.bar .st{font-size:12.5px;color:var(--sub);margin-left:4px}
.bar .st.dirty{color:#c4572b;font-weight:700}
.bar input.name{border:2px solid #c7d2db;border-radius:999px;padding:6px 12px;font-size:14px;width:150px;outline:none}
.bar input.name:focus{border-color:var(--accent)}
.banner{background:#fff3cd;border:1px solid #f0d58c;border-radius:12px;padding:10px 14px;margin:0 0 10px;font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hint{font-size:12.5px;color:var(--sub);margin:6px 0 0}
.lbl{font-size:13px;font-weight:700;color:var(--sub);margin:12px 0 5px;display:block}
.fld{width:100%;border:2px solid #d3dce3;border-radius:10px;padding:9px 11px;font-size:15px;line-height:1.5;outline:none;background:#fff;resize:none}
.fld:focus{border-color:var(--accent)}
textarea.fld{min-height:44px;overflow:hidden}
.ro .fld,.fld[readonly]{background:#fafbfc}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.fld{flex:1;min-width:0}
.seg{display:inline-flex;border:2px solid var(--accent);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--accent);font-weight:700;font-size:14px;padding:7px 16px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:2px solid var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
.center{text-align:center}
.topicbar{border:3px solid var(--titleLine);background:var(--title);border-radius:10px;display:flex;align-items:center;gap:12px;padding:6px 12px;margin:0 0 14px}
.topicbar b{background:var(--titleLine);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:6px;white-space:nowrap}
.topicbar .fld{border:0;background:transparent;font-size:20px;font-weight:700;padding:4px 0}
.topicbar .fld::placeholder{color:#c9b37a;font-weight:400}
.ce{outline:none;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.ce:empty::after{content:attr(data-ph);color:#a6b2bc;font-weight:400}
.empty-note{color:#8c9aa6;text-align:center;padding:30px 10px;font-size:14.5px}

/* 잠금(읽기 전용) · 학생 화면 */
.ro .e,.ro .cfg-btn,.ro .add,.ro .del{display:none !important}
.student .cfg-btn,.student .tonly{display:none !important}
.teacher .sonly{display:none !important}

/* 모달 */
.modal{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:18px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 10px;font-size:18px}
.modal .close{float:right}
.list-row{display:flex;align-items:center;gap:6px;padding:9px 4px;border-bottom:1px solid #eef1f4}
.list-row:last-child{border-bottom:0}
.list-row.cur{background:#eaf2f8;border-radius:8px}
.list-row .t{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row .t small{display:block;font-weight:400;color:#7b8a96;font-size:12px}
.qr{display:flex;justify-content:center;margin:6px 0 10px}
.qr svg{width:min(260px,70vw);height:auto}
.url{font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px;word-break:break-all;margin-bottom:10px}
.bigqr{position:fixed;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;cursor:pointer}
.bigqr svg{width:min(78vh,90vw);height:auto}
.bigqr b{font-size:clamp(20px,4vw,40px)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#22303c;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:70;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}

/* ---------- 만다라트 ---------- */
.mv{display:none}.mv.on{display:block}
.mgrid{display:grid;border:3px solid var(--line);margin:0 auto;width:min(100%, max(340px, calc(100vh - 265px)));max-width:820px;aspect-ratio:1/1;position:relative}
.g4{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);max-width:720px;width:min(100%, max(320px, calc(100vh - 330px)))}
.g9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.g16{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.mgrid .cell{border:1px solid var(--line);position:relative;padding:22px 7px 7px;font-size:15px;line-height:1.45;overflow:hidden}
.mgrid .cell::before{content:attr(data-n);position:absolute;top:5px;left:6px;font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.mgrid .cell:focus{background:#f7fbff}
.mgrid .cell.filled{background:#fbfdff}
.mgrid .title{background:var(--title);border:3px solid var(--titleLine);display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:19px;font-weight:700;transition:background .4s,color .4s}
.mgrid .title::before{content:"주제";top:6px;left:50%;transform:translateX(-50%);width:auto;height:auto;border-radius:6px;padding:1px 8px;background:var(--titleLine);color:#fff;font-size:11px}
.g16 .title{grid-column:2 / 4;grid-row:2 / 4;font-size:24px}
.mgrid.done .title{background:linear-gradient(135deg,#ff6b6b,#f59f00);border-color:#e8590c;color:#fff;font-size:clamp(26px,8vw,44px);font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.25);animation:glow 1.8s ease-in-out infinite alternate;z-index:1}
.g16.done .title{font-size:clamp(32px,10vw,60px)}
.mgrid.done .title::before{content:"완성!";background:#fff;color:#e8590c}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(245,159,0,.5)}to{box-shadow:0 0 26px 8px rgba(245,159,0,.55)}}
.badge4{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40%;aspect-ratio:1/1;border-radius:50%;background:linear-gradient(135deg,#ff6b6b,#f59f00);color:#fff;font-weight:900;font-size:clamp(18px,5vw,32px);align-items:center;justify-content:center;text-align:center;padding:12px;text-shadow:0 2px 6px rgba(0,0,0,.25);border:4px solid #fff;animation:glow 1.8s ease-in-out infinite alternate;word-break:keep-all;line-height:1.25}
.g4.done .badge4{display:flex}
.reflect-box{margin-top:16px}
.lined{border:0;border-top:1px solid #9aa8b3;border-radius:0;line-height:34px;padding:0 4px;min-height:70px;background:repeating-linear-gradient(transparent 0,transparent 33px,#c5cfd7 33px,#c5cfd7 34px);font-size:15px}
.lined:focus{border-top-color:var(--accent)}

/* ---------- 마인드맵 ---------- */
.mm{position:relative;width:min(100%, max(340px, calc((100vh - 225px) * 100 / 110)));max-width:900px;aspect-ratio:100/110;margin:0 auto}
.mm svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;padding:4px 6px;background:#fff;cursor:text;animation:pop .28s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.2);opacity:0}}
.node .ce{width:100%;min-height:1.3em}
.node.center{width:26%;aspect-ratio:1.5/1;border-radius:50%;background:var(--title);border:3px solid var(--titleLine);font-size:clamp(13px,3vw,20px);font-weight:700;z-index:2}
.node.center::before{content:"주제";position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--titleLine);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:6px}
.node.main{width:19%;aspect-ratio:2/1;border-radius:12px;border:2.5px solid;font-size:clamp(10.5px,2.2vw,15px);font-weight:700;z-index:1}
.node.sub{width:16%;aspect-ratio:2.2/1;border-radius:10px;border:1.5px dashed;font-size:clamp(9.5px,1.9vw,13px);padding:2px 4px}
.node.sel{box-shadow:0 0 0 4px rgba(47,111,159,.25)}
.node .add,.node .del{position:absolute;border:0;cursor:pointer;font-weight:700;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.25);z-index:3;color:#fff}
.node .add{width:26px;height:26px;border-radius:50%;font-size:19px;line-height:26px;top:-12px;right:-12px}
.node.center .add{top:auto;right:auto;bottom:-16px;left:50%;transform:translateX(-50%);width:auto;height:30px;border-radius:999px;padding:0 14px;font-size:14px;line-height:30px;background:var(--titleLine);white-space:nowrap}
.node .del{display:none;width:24px;height:24px;border-radius:50%;background:#5b6b78;font-size:15px;line-height:24px;top:-11px;left:-11px}
.node.sel .del{display:block}
.mmhint{position:absolute;left:50%;top:72%;transform:translateX(-50%);font-size:14px;color:var(--sub);white-space:nowrap}

/* ---------- 벤다이어그램 ---------- */
.venn{position:relative;width:min(100%, max(340px, calc((100vh - 300px) * 1.6)));max-width:1000px;aspect-ratio:16/10;margin:0 auto}
.venn svg{position:absolute;inset:0;width:100%;height:100%}
.venn .vl{position:absolute;top:1%;width:34%;text-align:center;border:0;border-bottom:2px dashed #b9c4cd;background:transparent;font-size:clamp(14px,2.6vw,19px);font-weight:900;outline:none;padding:4px}
.venn textarea{position:absolute;top:27%;height:52%;border:0;background:transparent;resize:none;outline:none;text-align:center;font-size:clamp(11px,2vw,15px);line-height:1.45;padding:4px}
.venn textarea:focus{background:rgba(255,255,255,.55);border-radius:10px}
.venn .tag{position:absolute;bottom:3%;font-size:12px;color:var(--sub);transform:translateX(-50%);white-space:nowrap}

/* ---------- KWL ---------- */
.kwl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kwl .col{border-radius:14px;padding:12px;display:flex;flex-direction:column}
.kwl .col h4{margin:0 0 2px;font-size:18px}
.kwl .col p{margin:0 0 8px;font-size:12.5px;color:var(--sub)}
.kwl textarea{flex:1;min-height:220px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.08)}

/* ---------- 피시본 ---------- */
.fish{display:grid;grid-template-columns:repeat(3,1fr) minmax(110px,22%);grid-template-rows:auto 34px auto;gap:0 10px;position:relative}
.fish .bone{background:#f6f8fa;border:1px solid #dfe5ea;border-radius:12px;padding:8px;position:relative}
.fish .bone input{font-weight:900;font-size:15px;border:0;background:transparent;width:100%;outline:none;color:var(--accent);padding:2px 0 4px}
.fish .bone textarea{min-height:76px;font-size:14px}
.fish .spine{grid-column:1 / 4;grid-row:2;align-self:center;height:6px;background:var(--line);border-radius:3px;position:relative}
.fish .spine::after{content:"";position:absolute;right:-14px;top:50%;transform:translateY(-50%);border:12px solid transparent;border-left:16px solid var(--line)}
.fish .head{grid-column:4;grid-row:1 / 4;align-self:center;background:#fff1e6;border:3px solid #e8590c;border-radius:50% 18px 18px 50%;padding:14px 10px;display:flex;flex-direction:column;justify-content:center;min-height:150px}
.fish .head b{font-size:12px;color:#e8590c;text-align:center;display:block;margin-bottom:4px}
.fish .head textarea{border:0;background:transparent;text-align:center;font-weight:700;font-size:16px}
.fish .bone.t{grid-row:1}
.fish .bone.b{grid-row:3}
.fish .bone::after{content:"";position:absolute;left:50%;width:2px;height:22px;background:var(--line)}
.fish .bone.t::after{bottom:-23px}
.fish .bone.b::after{top:-23px}

/* ---------- 이야기 지도 ---------- */
.story{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.story .box{background:#f6f8fa;border-radius:12px;padding:10px}
.story .box b{display:block;font-size:13px;color:var(--accent);margin-bottom:4px}
.story .full{grid-column:1 / -1}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch}
.flow .arrow{align-self:center;font-size:20px;color:#9aa8b3}
.flow textarea{min-height:110px}

/* ---------- 결과 막대 ---------- */
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.barrow{display:grid;grid-template-columns:minmax(70px,30%) 1fr 84px;gap:8px;align-items:center;font-size:14px}
.barrow .lab{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .track{background:#eef1f4;border-radius:999px;height:22px;overflow:hidden}
.barrow .fill{height:100%;border-radius:999px;transition:width .5s}
.barrow .num{text-align:right;color:var(--sub);font-size:13px}
.big-num{font-size:40px;font-weight:900;color:var(--accent)}

/* ---------- 투표 ---------- */
.opts .row{margin-bottom:6px}
.choices{display:grid;gap:8px}
.choice{border:2px solid #d3dce3;background:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;text-align:left}
.choice.on{border-color:var(--accent);background:#eaf2f8}
.qtitle{font-size:21px;font-weight:900;margin:4px 0 12px}

/* ---------- 출구 카드 ---------- */
.cardsgrid{columns:2 220px;column-gap:10px;margin-top:10px}
.xcard{break-inside:avoid;display:inline-block;width:100%;background:#fffbe8;border:1px solid #f0e2a8;border-radius:12px;padding:10px 12px;margin:0 0 10px;position:relative}
.xcard h5{margin:0 0 6px;font-size:14px}
.xcard .qa{font-size:13.5px;margin-bottom:6px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.xcard .qa i{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.xcard .x{position:absolute;top:6px;right:6px}

/* ---------- 생각 온도계 ---------- */
.faces{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.face{border:2px solid #d3dce3;background:#fff;border-radius:16px;padding:10px 8px 6px;cursor:pointer;width:72px;text-align:center}
.face span{display:block;font-size:34px;line-height:1.1}
.face small{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.face.on{border-color:var(--accent);background:#eaf2f8}
.comments{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.comments div{background:#f6f8fa;border-radius:10px;padding:8px 10px;font-size:13.5px}

/* ---------- 워드클라우드 ---------- */
.wc{position:relative;width:100%;aspect-ratio:4/3;border:2px solid #d7dee4;border-radius:12px;overflow:hidden;background:#fbfcfd;margin:10px 0}
.wc span{position:absolute;white-space:nowrap;font-weight:900;line-height:1;transform:translate(-50%,-50%);animation:wcpop .35s ease-out both}
@keyframes wcpop{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}}
.wc .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#8c9aa6;font-size:15px;line-height:1.6;padding:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid #c7d2db;border-radius:999px;padding:2px 4px 2px 10px;font-size:14px}
.chip em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:0 7px;margin:0 2px 0 6px}
.chip button{border:0;background:transparent;font-size:15px;width:26px;height:26px;border-radius:50%;cursor:pointer;color:#5b6b78;padding:0}

/* ---------- 담벼락 ---------- */
.wlform{background:#f6f8fa;border:2px solid #d7dee4;border-radius:14px;padding:12px;margin-bottom:12px}
.dots{display:flex;gap:6px}
.dots button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.12);cursor:pointer;padding:0}
.dots button.on{outline:3px solid var(--accent);outline-offset:1px}
.wall{columns:3 180px;column-gap:12px}
.note{break-inside:avoid;margin:0 0 12px;border-radius:6px;padding:12px 12px 10px;box-shadow:0 2px 6px rgba(0,0,0,.12);position:relative;animation:pop2 .3s ease-out both;display:inline-block;width:100%}
@keyframes pop2{from{opacity:0;transform:scale(.6)}}
.note p{margin:0;font-size:15.5px;line-height:1.55;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;padding-right:16px}
.note footer{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:rgba(0,0,0,.55)}
.note footer b{color:rgba(0,0,0,.75)}
.note .x{position:absolute;top:4px;right:4px;border:0;background:transparent;font-size:15px;min-width:26px;height:26px;border-radius:999px;cursor:pointer;color:rgba(0,0,0,.4);padding:0 6px}
.note .x.warn{background:var(--warn) !important;color:#fff !important;font-size:12px}

/* ---------- 뽑기·모둠 ---------- */
.stage{background:linear-gradient(135deg,#2f6f9f,#4c9bd1);color:#fff;border-radius:16px;min-height:150px;display:flex;align-items:center;justify-content:center;font-size:clamp(34px,9vw,72px);font-weight:900;text-align:center;padding:16px;margin:10px 0;word-break:keep-all}
.stage.flash{animation:flash .5s ease-out}
@keyframes flash{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.grp{border-radius:12px;padding:10px 12px;border:2px solid}
.grp b{display:block;margin-bottom:4px}
.grp div{font-size:15px;line-height:1.6}
.drawn{font-size:13px;color:var(--sub);margin-top:6px}

/* ---------- 돌림판 ---------- */
.wheelwrap{position:relative;width:min(420px,100%);margin:10px auto}
.wheelwrap canvas{width:100%;height:auto;display:block}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #22303c;z-index:2}
.result{text-align:center;font-size:clamp(24px,6vw,40px);font-weight:900;min-height:1.4em;color:var(--accent)}

/* ---------- 타이머 ---------- */
.clock{font-size:clamp(70px,22vw,180px);font-weight:900;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:2px;line-height:1.1;margin:10px 0}
.clock.end{color:var(--warn);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.prog{height:12px;background:#eef1f4;border-radius:999px;overflow:hidden;margin:0 0 14px}
.prog div{height:100%;background:var(--accent);transition:width .3s linear}

/* ---------- 낱말 카드 ---------- */
.fc-row{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.fc-row span{font-size:12px;color:var(--sub);text-align:center}
.flip{perspective:1000px;width:100%;max-width:520px;aspect-ratio:3/2;margin:10px auto;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.back .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:clamp(24px,6vw,42px);font-weight:900;box-shadow:0 4px 16px rgba(0,0,0,.12);word-break:keep-all;white-space:pre-wrap}
.flip-f{background:#fff;border:3px solid var(--accent)}
.flip-b{background:var(--accent);color:#fff;transform:rotateY(180deg)}
.fc-nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.fc-count{text-align:center;color:var(--sub);font-size:13px;margin-top:6px}

/* ---------- 빙고 ---------- */
.bingo{display:grid;gap:4px;max-width:520px;margin:10px auto;aspect-ratio:1/1}
.bcell{border:2px solid #c7d2db;border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:clamp(12px,3vw,18px);padding:4px;background:#fff;position:relative;overflow:hidden;line-height:1.25}
.bingo.play .bcell{cursor:pointer;user-select:none}
.bcell.mk{background:#ffe066;border-color:#f59f00}
.bcell.mk::after{content:"";position:absolute;inset:12%;border:4px solid rgba(232,89,12,.55);border-radius:50%}
.bcount{text-align:center;font-size:22px;font-weight:900;color:#e8590c;min-height:1.4em}

/* ---------- 순서 맞추기 ---------- */
.seq{list-style:none;padding:0;margin:10px 0;counter-reset:s}
.seq li{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #d3dce3;border-radius:12px;padding:10px 10px;margin-bottom:6px;font-size:15.5px;counter-increment:s}
.seq li::before{content:counter(s);font-weight:900;color:var(--accent);width:22px;text-align:center}
.seq li span{flex:1;word-break:keep-all}
.seq li.ok{border-color:#2f8f5b;background:#eaf6ec}
.seq li.no{border-color:var(--warn);background:#fdeef3}
.seq li button{border:1px solid #c7d2db;background:#fff;border-radius:8px;width:34px;height:30px;cursor:pointer}
.score{text-align:center;font-size:20px;font-weight:900;min-height:1.4em}

/* ---------- 학습 일지 ---------- */
.moods{display:flex;gap:6px;flex-wrap:wrap}
.moods button{border:2px solid #d3dce3;background:#fff;border-radius:12px;font-size:26px;width:52px;height:52px;cursor:pointer}
.moods button.on{border-color:var(--accent);background:#eaf2f8}

/* ---------- 루브릭 ---------- */
.rub{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.rub th{font-size:13px;padding:6px;border-radius:8px;background:var(--soft)}
.rub td{vertical-align:top;border:2px solid #e1e7ec;border-radius:10px;padding:6px;background:#fff;position:relative}
.rub td.lv{cursor:pointer}
.rub td.lv.on{border-color:var(--accent);background:#eaf2f8}
.rub td.lv.on::after{content:"✔";position:absolute;top:4px;right:6px;color:var(--accent);font-weight:900}
.rub textarea,.rub input{border:0;background:transparent;width:100%;resize:none;outline:none;font-size:13.5px;line-height:1.4;padding:0}
.rub input{font-weight:700;font-size:14px}
.student .rub textarea{pointer-events:none}

/* ---------- 깊이 생각하기 ---------- */
.cerbox{border-radius:14px;padding:12px;margin-bottom:6px;border:2px solid}
.cerbox.c1{background:#eaf2f8;border-color:#b9d3e6}
.cerbox.c2{background:#fff6d6;border-color:#f0d58c}
.cerbox.c3{background:#eaf6ec;border-color:#b7dcc0}
.cerbox.c4{background:#f6f1fb;border-color:#d9c8ea;margin-top:12px}
.cerbox .fld+.fld{margin-top:6px}
.cerh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.cerh span{font-size:20px}
.cerh b{font-size:17px}
.cerh small{color:var(--sub);font-size:12.5px}
.cerarrow{text-align:center;color:var(--sub);font-size:13px;font-weight:700;margin:4px 0 6px}
.checks{margin-top:14px;background:#f6f8fa;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.checks label{display:flex;gap:8px;align-items:center}
.stwimg{text-align:center}
.stwimg img{max-width:100%;max-height:420px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12);cursor:zoom-in}
.stwinfo .fld{margin-top:8px}
.chg{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.chgbox{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.chgbox.before{background:#f1f3f5}
.chgbox.after{background:#fff3cd}
.chgbox textarea{flex:1;min-height:110px}
.chgbox small{color:var(--sub);font-size:12px}
.chgarrow{align-self:center;font-size:26px;color:#c99a12}
.stance{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.strow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.strow b{grid-column:1 / -1;font-size:14px}
.strow .choice{text-align:center}
.strow .choice:disabled{opacity:.6;cursor:default}
.dresgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dresgrid small{font-weight:700;color:var(--sub)}
.moved{margin-top:8px;font-size:14.5px;background:#fff3cd;border-radius:10px;padding:8px 12px}
.dcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcol{border-radius:14px;padding:10px}
.dcol.a{background:#eaf2f8}
.dcol.b{background:#fdece6}
.dcol h4{margin:0 0 8px;font-size:15px}
.argc{background:#fff;border-radius:10px;padding:8px 30px 8px 10px;margin-bottom:8px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.argc p{margin:0 0 4px;font-size:14.5px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.argc small{color:var(--sub);font-size:12px}
.argc .x,.rep .rx{position:absolute;top:4px;right:4px;border:0;background:transparent;color:#9aa8b3;cursor:pointer;border-radius:999px;min-width:22px;height:22px;padding:0 5px;font-size:13px}
.argc .x.warn,.rep .rx.warn{background:var(--warn) !important;color:#fff !important;font-size:11px}
.sumt{border-collapse:collapse;width:100%;font-size:13px}
.sumt th,.sumt td{border:1px solid #e1e7ec;padding:6px 8px;text-align:left;vertical-align:top;word-break:keep-all;overflow-wrap:anywhere}
.sumt th{background:var(--soft);white-space:nowrap}
/* 담벼락 댓글 */
.note .why{margin-top:6px;font-size:14px;background:rgba(255,255,255,.55);border-radius:8px;padding:6px 8px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.note .why b{color:#8a6d00}
.reps{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.rep{position:relative;background:rgba(255,255,255,.7);border-radius:8px;padding:5px 26px 5px 8px;font-size:13px;word-break:keep-all;overflow-wrap:anywhere}
.rep .rt{font-weight:700;font-size:12px}
.rep.q .rt{color:#2f6f9f}.rep.add .rt{color:#2f8f5b}.rep.like .rt{color:#d0457a}
.rep small{color:rgba(0,0,0,.5)}
.repbtn{border:0;background:rgba(255,255,255,.6);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;margin-top:8px}
.repform{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.repform .fld{padding:6px 9px;font-size:14px}
.rtseg{display:flex;gap:4px;flex-wrap:wrap}
.rtseg button{border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.7);border-radius:999px;padding:3px 9px;font-size:12px;cursor:pointer}
.rtseg button.on{background:#22303c;color:#fff;border-color:#22303c}

/* 기존 도구 깊이 더하기 */
.deepq{margin-top:16px;background:#f7f4ff;border:2px solid #e2d8f6;border-radius:14px;padding:12px}
.pickbox{margin:8px 0 0;background:#fff4e6;border:2px solid #ffd8a8;border-radius:14px;padding:12px}
.mgrid.picking .cell:not(.title){cursor:pointer}
.mgrid.picking .cell:not(.title):hover{background:#fff4e6}
.mgrid .cell.pick{box-shadow:inset 0 0 0 4px #f59f00;background:#fff4e6}
.mgrid .cell.pick::after{content:"⭐";position:absolute;top:3px;right:5px;font-size:15px}
.qlist{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:6px 8px;font-size:14px}
.qrow span{flex:1;word-break:keep-all}
.qst{border:1px solid #c7d2db;background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.qst.half{background:#fff3cd;border-color:#f0d58c}
.qst.ok{background:#eaf6ec;border-color:#2f8f5b;color:#2f8f5b;font-weight:700}
.fish .bone .star{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:19px;cursor:pointer;color:#f59f00;padding:0;line-height:1}
.fish .bone input{padding-right:24px}
.fish .bone.picked{border:3px solid #f59f00;background:#fff4e6}
.pickshow{font-weight:700;font-size:14.5px;color:#8a4fb3}
.ladder{display:flex;flex-direction:column;gap:6px}
.rung{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center}
.rung b{font-size:12.5px;color:#fff;background:#8a4fb3;border-radius:999px;text-align:center;padding:4px 0}
.rung:nth-child(2){margin-left:14px}.rung:nth-child(3){margin-left:28px}
.reasons{margin-top:6px}
.rgroup{background:#f6f8fa;border-radius:12px;padding:8px 10px;margin-bottom:8px}
.rgroup.minor{background:#fff4e6;border:2px solid #ffd8a8}
.rgroup .mtag{display:inline-block;margin-left:8px;font-size:12px;font-weight:700;color:#e8590c}
.rr{font-size:14px;margin-top:5px;word-break:keep-all;overflow-wrap:anywhere}
.rr small{color:var(--sub)}

/* ---------- 받아쓰기 ---------- */
.dgrid{display:grid;gap:6px;align-items:center}
.dhead{font-size:12.5px;font-weight:700;color:var(--sub)}
.dnum{font-weight:900;color:var(--accent);text-align:center}
.dgrid .fld{padding:7px 9px;font-size:15px}
.dread .dline{display:flex;align-items:center;gap:12px;padding:14px 10px;border-bottom:1px solid #eef1f4;font-size:clamp(20px,4.5vw,34px);font-weight:700;line-height:1.35;border-radius:10px;transition:background .3s}
.dread .dline.now{background:#fff3cd}
.dn{width:1.6em;height:1.6em;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.65em;flex:0 0 auto}
.dt{flex:1;word-break:keep-all;overflow-wrap:anywhere}
.dstage{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;background:#fbfcfd;border:2px solid #d7dee4;border-radius:16px;padding:20px}
.dbadge{background:var(--accent);color:#fff;font-weight:900;font-size:clamp(18px,4vw,30px);padding:4px 18px;border-radius:999px}
.dbig{font-size:clamp(32px,9vw,88px);font-weight:900;line-height:1.25;word-break:keep-all;overflow-wrap:anywhere}
.dsmall{font-size:clamp(18px,4.5vw,36px);color:var(--sub);font-weight:700;word-break:keep-all}
.ddots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ddots button{width:40px;height:40px;border-radius:50%;border:2px solid #c7d2db;background:#fff;font-weight:700;cursor:pointer}
.ddots button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dbox:fullscreen{background:#fff;padding:4vh 4vw;overflow:auto}
.dbox:fullscreen .dstage{min-height:68vh;border:0}
.dbox:fullscreen .dbig{font-size:clamp(48px,10vw,140px)}
.dbox.fake-fs{position:fixed;inset:0;z-index:80;background:#fff;padding:20px;overflow:auto}

@media (max-width:700px){
  .cards{grid-template-columns:1fr 1fr;gap:7px}
  .card{padding:9px 9px;gap:8px;flex-direction:column;align-items:flex-start}
  .card .ic{width:34px;height:34px;font-size:19px}
  .card b{font-size:14.5px}
  .ghead h2{font-size:19px}
  main{padding:10px 10px 50px}
  .panel{padding:12px}
  .kwl{grid-template-columns:1fr}
  .nbedit{grid-template-columns:1fr}
  .kwl textarea{min-height:120px}
  .story{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr;}
  .flow .arrow{transform:rotate(90deg);justify-self:center}
  .fish{grid-template-columns:repeat(3,1fr);grid-template-rows:auto auto 34px auto}
  .fish .head{grid-column:1 / -1;grid-row:1;border-radius:18px;min-height:0;margin-bottom:10px}
  .fish .spine{grid-row:3}
  .fish .bone.t{grid-row:2}
  .fish .bone.b{grid-row:4}
  .fish .bone textarea{font-size:12.5px}
  .mgrid .cell{font-size:12px;padding:20px 4px 4px}
  .wall{columns:2 140px;column-gap:8px}
  .note p{font-size:14px}
  .face{width:58px}
  .face span{font-size:28px}
  .top-in{padding:8px 10px}
  .brand{font-size:16px}
  .rub{font-size:12px}
  .seg button{padding:7px 11px;font-size:13.5px}
  .chg{grid-template-columns:1fr}
  .chgarrow{transform:rotate(90deg);justify-self:center}
  .dcols,.dresgrid{grid-template-columns:1fr}
  .dgrid .fld{padding:6px 7px;font-size:14px}
}
/* ---------- 오른쪽 도구 서랍 ---------- */
.dr-zone,.dr-tab,.dr-back,.drawer{display:none}
body.has-drawer .dr-zone{display:block;position:fixed;top:0;right:0;width:14px;height:100vh;z-index:40}
body.has-drawer .dr-tab{display:flex;position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:41;flex-direction:column;align-items:center;gap:2px;border:0;border-radius:12px 0 0 12px;background:rgba(47,111,159,.88);color:#fff;padding:12px 6px;cursor:pointer;box-shadow:-2px 2px 8px rgba(0,0,0,.15);font-size:12px}
body.has-drawer .dr-tab b{writing-mode:vertical-rl;letter-spacing:2px;font-size:13px}
body.has-drawer .drawer{display:block;position:fixed;top:0;right:0;height:100vh;width:min(300px,86vw);background:#fff;z-index:46;overflow-y:auto;box-shadow:-6px 0 24px rgba(0,0,0,.18);padding:14px 12px 30px;transform:translateX(105%);transition:transform .22s ease-out}
body.dr-open .drawer{transform:none}
body.dr-open .dr-back{display:block;position:fixed;inset:0;background:rgba(20,30,40,.25);z-index:45}
body.dr-open .dr-tab{opacity:0;pointer-events:none}
.dr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.dr-head b{font-size:16px}
.dr-g{font-size:13.5px;font-weight:900;margin:14px 0 6px;padding-bottom:4px;border-bottom:2px solid}
.dr-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;border-radius:10px;padding:8px 10px;font-size:14.5px;text-align:left;cursor:pointer}
.dr-item:hover{background:#f1f4f7}
.dr-item.cur{background:var(--gc);color:#fff;font-weight:700}
.dr-item.warn{background:#fdeef3 !important;color:var(--warn) !important;border:0 !important;font-size:12.5px}
body.present .dr-tab,body.present .dr-zone{display:none !important}
@media (pointer:coarse){body.has-drawer .dr-zone{width:0}}

/* ---------- 알림장 ---------- */
.nbedit{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.nb{--nbz:1;background:#fffdf5;border:2px solid #efe3b8;border-radius:16px;padding:20px 24px;margin-top:6px}
.nbh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double #c99a12;padding-bottom:10px;margin-bottom:8px;gap:10px;flex-wrap:wrap}
.nbh b{font-size:calc(var(--nbz) * clamp(26px,3.6vw,40px))}
.nbh span{color:#b07d00;font-weight:900;letter-spacing:4px;font-size:calc(var(--nbz) * 18px)}
.nbs h4{margin:18px 0 6px;font-size:calc(var(--nbz) * clamp(22px,2.9vw,32px))}
.nbs ol{margin:0;padding-left:1.6em;font-size:calc(var(--nbz) * clamp(22px,2.8vw,32px));line-height:1.75}
.nbs li label{display:inline-flex;gap:10px;align-items:center;cursor:pointer}
.nbs li input{width:calc(var(--nbz) * 28px);height:calc(var(--nbz) * 28px);accent-color:#2f8f5b;flex:none}
.nbs li{border-bottom:1px dashed #efe3b8;padding:2px 0}.nbs li:last-child{border-bottom:0}
.nbs li.done span{text-decoration:line-through;color:#8c9aa6}
.nbmsg{margin:0;font-size:calc(var(--nbz) * clamp(22px,2.8vw,32px));line-height:1.7;white-space:pre-wrap}
.seen{margin-top:12px}
body.present .nbh b{font-size:calc(var(--nbz) * clamp(36px,6vh,72px))}
body.present .nbs h4{font-size:calc(var(--nbz) * clamp(30px,4.4vh,52px))}
body.present .nbs ol,body.present .nbmsg{font-size:calc(var(--nbz) * clamp(32px,4.8vh,58px))}

/* ---------- 바른 글씨 ---------- */
.batang{font-family:"Gowun Batang","Nanum Myeongjo","Noto Serif KR",serif}
.dodum{font-family:"Gowun Dodum","Noto Sans KR",sans-serif}
.hwpicks{display:flex;flex-wrap:wrap;gap:6px}
.hwpick{border:2px solid #d3dce3;background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.hwpick.on{border-color:#b07d00;background:#fff6d6;font-weight:700}
.hwopt{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.hwprev{text-align:center;margin:10px 0}
.hwbig{font-size:clamp(24px,4.4vw,44px);line-height:1.4;word-break:keep-all}
.hwbig .sp{color:#e03131;font-weight:900;font-family:"Noto Sans KR",sans-serif;font-size:.8em;margin:0 .08em;vertical-align:-.05em}
.hwtools{margin:8px 0;justify-content:center}

function FireBackend(cfg) {

      signIn: function () { return A.signInWithPopup(auth, new A.GoogleAuthProvider()); },
      signOut: function () { return A.signOut(auth); },

        return F.onSnapshot(F.query(col('activities'), F.where('owner', '==', user.uid), F.where('tool', '==', tool)),
          function (s) { cb(map(s)); }, function (e) { warn(e); cb([]); });

var presentFS = false;

function route() {

        var V = App.V;

}

// 그림 올리기: 크기를 줄여 저장 (Firestore 문서 1MB 제한 안쪽)
function pickImage(cb) {
  var f = h('input', { type: 'file', accept: 'image/*', style: { display: 'none' } });
  document.body.appendChild(f);
  f.addEventListener('change', function () {
    var file = f.files && f.files[0]; f.remove(); if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1100, w = img.width, hh = img.height, s = Math.min(1, max / Math.max(w, hh));
        var cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(hh * s);
        var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        var q = 0.8, url = cv.toDataURL('image/jpeg', q);
        while (url.length > 600000 && q > 0.35) { q -= 0.1; url = cv.toDataURL('image/jpeg', q); }
        cb(url);
      };
      img.onerror = function () { toast('그림을 열지 못했어요'); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
  f.click();
}

    };
  }

// ---------- 공통: 반 명단 ----------

// 저장소의 활동 목록을 한 번만 받아요
function onceActs(B, tool) {
  return new Promise(function (res) {
    var done = false, un = null;
    un = B.listActivities(tool, function (l) { if (done) return; done = true; setTimeout(function () { if (un) un(); }, 0); res(l || []); });
    setTimeout(function () { if (!done) { done = true; res([]); } }, 6000);

  });
}
